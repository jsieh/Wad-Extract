name: Extract wad_psp2

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Siapkan input
        run: |
          mkdir -p wad report out
          if [ -f wad.zip ]; then unzip -oj wad.zip -d wad; fi
          find . -path ./wad -prune -o -path ./.git -prune -o -type f -iname '*.wad_psp2' -print0 \
            | xargs -0 -r -I{} cp -n "{}" wad/
          ls -l wad | tee report/file-list.txt
          count=$(find wad -type f -iname '*.wad_psp2' | wc -l)
          echo "Jumlah file .wad_psp2: $count"
          [ "$count" -gt 0 ] || { echo "Tidak ada file .wad_psp2"; exit 1; }

      - name: Build tools
        run: |
          git clone --depth 1 https://github.com/mogaika/god_of_war_browser.git gowb
          cd gowb
          go build -o ../wadunpack ./tools/wadunpack
          go build -o ../gowb-server .
          cd ..
          ls -l wadunpack gowb-server

      - name: Ekstrak dengan wadunpack
        continue-on-error: true
        run: |
          for f in wad/*.wad_psp2; do
            n=$(basename "$f" .wad_psp2)
            mkdir -p "out/$n"
            echo "### $n" >> report/extract-log.txt
            ./wadunpack -wad "$f" -out "out/$n" >> report/extract-log.txt 2>&1 || echo "GAGAL: $n" >> report/extract-log.txt
          done
          find out -type f | wc -l | tee report/jumlah-hasil.txt
          find out -type f | head -n 300 > report/daftar-hasil.txt
          du -sh out | tee -a report/jumlah-hasil.txt

      - name: Jalankan browser server (discovery)
        continue-on-error: true
        run: |
          mkdir -p wadrun
          for f in wad/*.wad_psp2; do
            n=$(basename "$f" .wad_psp2 | tr a-z A-Z)
            cp "$f" "wadrun/$n.WAD"
          done
          cd gowb
          for v in 1 2; do
            ../gowb-server -dir ../wadrun -ps psvita -gowversion $v -i 127.0.0.1:8000 > ../report/server-v$v.log 2>&1 &
            pid=$!
            sleep 8
            curl -s http://127.0.0.1:8000/ -o ../report/index-v$v.html || true
            curl -s http://127.0.0.1:8000/json/fs -o ../report/fs-v$v.json || true
            curl -s http://127.0.0.1:8000/json/pack -o ../report/pack-v$v.json || true
            curl -s http://127.0.0.1:8000/json/pack/R_WEAPON0_0.WAD -o ../report/pack-weapon0_0-v$v.json || true
            kill $pid 2>/dev/null || true
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-ekstrak
          path: |
            out/
            report/
