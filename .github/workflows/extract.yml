name: Extract wad_psp2

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan input
        run: |
          mkdir -p wad report out
          if [ -f wad.zip ]; then unzip -oj wad.zip -d wad; fi
          find . -path ./wad -prune -o -path ./.git -prune -o -type f -iname '*.wad_psp2' -print0 \
            | xargs -0 -r -I{} cp -n "{}" wad/
          ls -l wad | tee report/file-list.txt
          count=$(find wad -type f -iname '*.wad_psp2' | wc -l)
          echo "Jumlah file .wad_psp2: $count"
          [ "$count" -gt 0 ] || { echo "Tidak ada file .wad_psp2"; exit 1; }

      - name: Parser WAD sendiri
        run: |
          cat > /tmp/parse.py <<'EOF'
          import os, re, struct, sys, glob

          def clean(b):
              s = b.split(b"\0")[0].decode("latin-1", "replace")
              return re.sub(r"[^A-Za-z0-9_.\-]", "_", s) or "noname"

          index_lines = []
          for path in sorted(glob.glob("wad/*.wad_psp2")):
              base = os.path.basename(path)[:-len(".wad_psp2")]
              data = open(path, "rb").read()
              outdir = os.path.join("out", base)
              os.makedirs(outdir, exist_ok=True)
              off, idx, n = 0, 0, len(data)
              rows = ["offset\ttag\tflags\tsize\tname\thead32"]
              status = "OK"
              while off + 32 <= n:
                  tag, flags, size = struct.unpack_from("<HHI", data, off)
                  name = clean(data[off + 8: off + 32])
                  start = off + 32
                  if start + size > n:
                      status = "STOP: size %d melebihi file di offset 0x%x" % (size, off)
                      break
                  blob = data[start:start + size]
                  rows.append("0x%x\t0x%x\t0x%x\t%d\t%s\t%s" % (
                      off, tag, flags, size, name, blob[:32].hex()))
                  if size > 0:
                      fn = "%04d_t%02x_%s.bin" % (idx, tag, name)
                      open(os.path.join(outdir, fn), "wb").write(blob)
                  idx += 1
                  off = (start + size + 15) & ~15
              open(os.path.join(outdir, "_index.tsv"), "w").write("\n".join(rows))
              index_lines.append("%s: %d entry, sisa byte %d, %s" % (base, idx, n - off, status))
          open("report/parse-ringkasan.txt", "w").write("\n".join(index_lines))
          print("\n".join(index_lines))
          EOF
          python3 /tmp/parse.py
          find out -type f | wc -l | tee report/jumlah-hasil.txt
          find out -type f -name '*.bin' | head -n 300 > report/daftar-hasil.txt

      - name: Ringkasan entry texture
        run: |
          grep -hiE 'GFX|TXR|PAL|TEX' out/r_weapon0_0/_index.tsv | head -n 40 | tee report/contoh-texture.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-ekstrak
          path: |
            out/
            report/
