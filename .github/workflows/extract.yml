name: Extract wad_psp2

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # File boleh di root repo, di folder wad/, atau di dalam wad.zip
      - name: Siapkan input
        run: |
          mkdir -p wad report out
          if [ -f wad.zip ]; then unzip -oj wad.zip -d wad; fi
          cp -n ./*.wad_psp2 wad/ 2>/dev/null || true
          ls -l wad | tee report/file-list.txt
          count=$(ls wad/*.wad_psp2 2>/dev/null | wc -l)
          echo "Jumlah file .wad_psp2: $count"
          [ "$count" -gt 0 ] || { echo "Tidak ada file .wad_psp2"; exit 1; }

      - name: Inspeksi header
        run: |
          for f in wad/*.wad_psp2; do
            echo "=== $f ($(stat -c %s "$f") bytes) ==="
            xxd "$f" | head -n 16
            echo "--- strings ---"
            strings -n 6 "$f" | head -n 20
            echo
          done > report/inspect.txt

      - name: Build wadunpack (god_of_war_browser)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/mogaika/god_of_war_browser.git gowb
          cd gowb
          ls -R tools | tee ../report/tools-list.txt
          go build -o ../wadunpack ./tools/wadunpack 2>&1 | tee ../report/build-log.txt
          cd ..
          ls -l wadunpack || echo "wadunpack TIDAK terbuild" | tee -a report/build-log.txt
          ./wadunpack -h 2>&1 | tee report/wadunpack-help.txt || true

      # Coba dua urutan argumen, simpan semua output ke log
      - name: Coba ekstrak
        continue-on-error: true
        run: |
          [ -x ./wadunpack ] || { echo "wadunpack tidak ada, skip" | tee report/extract-log.txt; exit 0; }
          for f in wad/*.wad_psp2; do
            n=$(basename "$f" .wad_psp2)
            mkdir -p "out/$n"
            echo "### $n (urutan: file dir)" >> report/extract-log.txt
            ./wadunpack "$f" "out/$n" >> report/extract-log.txt 2>&1 || true
            if [ -z "$(ls -A "out/$n")" ]; then
              echo "### $n (urutan: dir file)" >> report/extract-log.txt
              ./wadunpack "out/$n" "$f" >> report/extract-log.txt 2>&1 || true
            fi
            if [ -z "$(ls -A "out/$n")" ]; then
              echo "GAGAL/KOSONG: $n" >> report/extract-log.txt
            else
              echo "OK: $n" >> report/extract-log.txt
            fi
          done
          find out -type f | wc -l | tee report/jumlah-hasil.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-ekstrak
          path: |
            out/
            report/
